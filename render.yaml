services:
  - type: web
    name: daymark-ledger-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate --config prisma7.config.ts && npm run build && npx prisma migrate deploy --config prisma7.config.ts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NODE_VERSION
        value: 24.18.0
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: daymark-ledger-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_NAME
        value: "Daymark Ledger"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
